<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="서울·경기 집수리 제자리에의 인조대리석 문지방, 누수복원, 목공, 생활집수리 시공사례입니다."><meta name="theme-color" content="#191816"><title>시공사례 | 제자리에</title>
<style>:root{--paper:#f2efe8;--ink:#191816;--muted:#817c74;--line:#484540;--brown:#a47d57}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;letter-spacing:-.025em}a{color:inherit}.shell{width:min(1440px,92vw);margin:auto}nav{height:74px;border-bottom:1px solid #3e3b37;display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.logo{text-decoration:none;font-size:22px;font-weight:800;letter-spacing:-.07em}.back{text-decoration:none;font-size:12px;border:1px solid #605c56;border-radius:99px;padding:10px 16px}.hero{padding:110px 0 90px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#aaa59c}.hero h1{font-size:clamp(64px,10vw,150px);line-height:1.04;letter-spacing:-.065em;margin:25px 0 38px}.hero p{max-width:520px;color:#c4c0b8;line-height:1.8}.filters{display:flex;flex-wrap:wrap;gap:8px;padding:25px 0 55px;border-top:1px solid var(--line)}button{font:inherit}.filter{background:none;color:#c4c0b8;border:1px solid #57534e;border-radius:99px;padding:10px 15px;cursor:pointer}.filter.active{background:var(--paper);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:100px 28px;padding-bottom:140px}.card{text-decoration:none;display:block}.media{aspect-ratio:4/3;overflow:hidden;background:#2d2b28}.media img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.card:hover img{transform:scale(1.025)}.meta{display:flex;justify-content:space-between;color:#aaa59c;font-size:11px;letter-spacing:.08em;border-top:1px solid var(--line);padding-top:16px;margin-top:15px}.card h2{font-size:clamp(28px,3vw,48px);line-height:1.12;letter-spacing:-.045em;margin:12px 0 10px}.card p{color:#bdb8b0;line-height:1.7;margin:0;max-width:620px}.empty{grid-column:1/-1;padding:80px 0;color:#aaa59c}footer{border-top:1px solid var(--line);padding:35px 0 80px;color:#aaa59c;font-size:12px}.count{color:var(--brown)}@media(max-width:700px){nav{height:64px}.hero{padding:75px 0 65px}.hero h1{font-size:clamp(55px,18vw,76px);line-height:1.06}.grid{grid-template-columns:1fr;gap:70px}.shell{width:calc(100% - 36px)}.card h2{font-size:34px}}</style></head>
<body><nav><div class="shell nav"><a class="logo" href="/">제자리에</a><a class="back" href="/">HOME ↗</a></div></nav><main><header class="shell hero"><div class="eyebrow">JEJARIE / WORK ARCHIVE</div><h1>고친 자리를<br>크게, 그대로.</h1><p>완성된 모습과 작업 과정을 함께 기록합니다. 제자리에가 직접 진행한 시공사례를 분야별로 확인해 보세요.</p></header><section class="shell"><div class="filters" id="filters"></div><div class="grid" id="grid"><div class="empty">시공사례를 불러오고 있습니다.</div></div></section></main><footer><div class="shell">© 2026 JEJARIE · 서울·경기 종합 집수리</div></footer>
<script>const categories=['전체','인조대리석 문지방','누수복원','목공','생활집수리','기타'];let projects=[];const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function card(x){const cover=x.coverImage||x.images?.[0]||'';return `<a class="card" href="/work/detail/?id=${encodeURIComponent(x.id)}"><div class="media"><img src="${esc(cover)}" alt="${esc(x.title)}" loading="lazy"></div><div class="meta"><span>${esc(x.category)}</span><span>${esc(x.workDate||x.year||'')}</span></div><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p></a>`}function render(category='전체'){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.category===category));const list=category==='전체'?projects:projects.filter(x=>x.category===category);document.getElementById('grid').innerHTML=list.map(card).join('')||'<div class="empty">이 카테고리의 시공사례를 준비하고 있습니다.</div>'}const filters=document.getElementById('filters');filters.innerHTML=categories.map(c=>`<button class="filter${c==='전체'?' active':''}" data-category="${c}">${c}</button>`).join('');filters.onclick=e=>{if(e.target.matches('.filter'))render(e.target.dataset.category)};fetch('/cases.json',{cache:'no-cache'}).then(r=>r.json()).then(data=>{projects=(Array.isArray(data)?data:[]).filter(x=>x.status!=='draft').sort((a,b)=>String(b.workDate||b.publishedAt).localeCompare(String(a.workDate||a.publishedAt)));render()}).catch(()=>document.getElementById('grid').innerHTML='<div class="empty">시공사례를 불러오지 못했습니다.</div>');</script></body></html>
