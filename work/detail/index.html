<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2efe8"><meta name="description" content="제자리에 시공사례의 현장 상황과 작업 과정, 결과를 확인하세요."><meta name="robots" content="index,follow,max-image-preview:large"><link id="canonical" rel="canonical" href="https://www.jejarie.com/work/detail/"><title>시공사례 | 제자리에</title><style>
:root{--paper:#f2efe8;--ink:#191816;--muted:#6d6962;--line:#cbc6bc;--brown:#896848;--sand:#ddd7cd}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;letter-spacing:-.025em;overflow-x:hidden}.shell{width:min(1240px,92vw);margin:auto}a{color:inherit}img{display:block;width:100%}nav{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:800;letter-spacing:-.07em;text-decoration:none}.back{font-size:12px;text-decoration:none}.head{padding:95px 0 70px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--brown);text-transform:uppercase}.head h1{max-width:12em;font-size:clamp(52px,7vw,104px);line-height:1.08;letter-spacing:-.06em;word-break:keep-all;margin:24px 0 35px}.lead{max-width:760px;font-size:clamp(17px,1.5vw,21px);line-height:1.8;color:var(--muted);word-break:keep-all}.facts{display:flex;gap:40px;border-top:1px solid var(--line);padding-top:18px;margin-top:50px;font-size:13px}.hero-media{width:min(1440px,96vw);height:min(72vw,860px);margin:auto;background:#d8d2c8;overflow:hidden}.hero-media img{height:100%;object-fit:cover}.record{padding:125px 0;border-bottom:1px solid var(--line)}.record-head{display:grid;grid-template-columns:.72fr 2.28fr;gap:7vw;margin-bottom:65px}.record h2{max-width:9em;font-size:clamp(38px,5vw,72px);line-height:1.1;letter-spacing:-.05em;word-break:keep-all;margin:0}.record-copy{max-width:760px;color:#504d48;font-size:17px;line-height:1.95;white-space:pre-line;word-break:keep-all}.story-photo{margin:65px 0 0 26%;width:74%;max-height:760px;object-fit:cover}.findings{counter-reset:finding;border-top:1px solid var(--line)}.finding{counter-increment:finding;display:grid;grid-template-columns:80px 1fr;gap:20px;padding:24px 0;border-bottom:1px solid var(--line);font-size:clamp(20px,2.2vw,31px);line-height:1.35;word-break:keep-all}.finding:before{content:counter(finding,decimal-leading-zero);font-size:12px;color:var(--brown);padding-top:7px}.process-list{display:grid;gap:150px}.process-step:nth-child(even){width:82%;margin-left:auto}.step-copy{display:grid;grid-template-columns:110px 1fr;gap:25px;border-top:1px solid var(--line);padding-top:20px;margin-bottom:35px}.step-number{color:var(--brown);font-size:12px;letter-spacing:.12em}.step-copy h3{font-size:clamp(30px,4vw,58px);line-height:1.12;letter-spacing:-.045em;word-break:keep-all;margin:0 0 18px}.step-copy p{max-width:720px;color:var(--muted);line-height:1.85;white-space:pre-line;word-break:keep-all;margin:0}.step-images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.step-images.one{grid-template-columns:1fr}.step-images img{height:min(55vw,720px);object-fit:cover}.step-images:not(.one) img{height:min(40vw,540px)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.compare figure{margin:0}.compare img{aspect-ratio:4/3;object-fit:cover}.compare figcaption{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:13px;margin-top:12px;font-size:12px;color:var(--muted)}.archive-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.archive-gallery img{height:min(52vw,650px);object-fit:cover}.archive-gallery img:nth-child(3n){grid-column:1/-1;height:min(65vw,800px)}.follow-photo{margin-top:45px;max-height:720px;object-fit:cover}.period{display:inline-block;color:var(--brown);font-size:12px;letter-spacing:.12em;margin-bottom:18px}.review{background:var(--sand)}.quote{font-size:clamp(25px,3.4vw,48px);line-height:1.5;letter-spacing:-.035em;word-break:keep-all;margin:0}.quote:before{content:'“';color:var(--brown)}.quote:after{content:'”';color:var(--brown)}.contact{background:var(--ink);color:var(--paper);padding:115px 0}.contact-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:8vw;align-items:end}.contact h2{max-width:9em;font-size:clamp(42px,5.5vw,78px);line-height:1.08;letter-spacing:-.055em;word-break:keep-all;margin:18px 0 0}.contact p{color:#c6c1b9;line-height:1.85;word-break:keep-all}.contact-actions{display:flex;gap:9px;margin-top:30px}.contact-actions a{flex:1;text-align:center;text-decoration:none;border:1px solid #77716a;border-radius:99px;padding:15px;font-size:13px;font-weight:700}.contact-actions a:first-child{background:var(--paper);color:var(--ink);border-color:var(--paper)}.related{padding:125px 0}.related-top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:25px;margin-bottom:45px}.related h2{font-size:clamp(38px,5vw,70px);line-height:1.1;letter-spacing:-.05em;margin:0}.more{text-decoration:none;font-size:13px;font-weight:700}.related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.related-card{text-decoration:none}.related-card img{aspect-ratio:4/3;object-fit:cover}.related-card small{display:block;color:var(--muted);margin-top:15px}.related-card h3{font-size:clamp(22px,2.2vw,32px);line-height:1.2;word-break:keep-all;margin:8px 0}.related-empty{color:var(--muted)}footer{background:var(--ink);color:var(--paper);padding:35px 0 80px;font-size:12px}.empty{padding:120px 0}
@media(max-width:800px){.record-head,.contact-grid{grid-template-columns:1fr;gap:35px}.story-photo{margin-left:0;width:100%}.process-step:nth-child(even){width:100%}.related-grid{grid-template-columns:1fr 1fr}.record-copy{font-size:16px}}
@media(max-width:650px){.shell{width:calc(100% - 36px)}nav{height:64px}.head{padding:65px 0 50px}.head h1{font-size:clamp(38px,10.5vw,46px);line-height:1.12;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}.facts{flex-wrap:wrap;gap:12px 25px}.hero-media{width:calc(100% - 24px);height:66svh;min-height:460px}.record{padding:85px 0}.record-head{margin-bottom:42px}.record h2{font-size:clamp(38px,11vw,46px)}.finding{grid-template-columns:50px 1fr}.process-list{gap:90px}.step-copy{grid-template-columns:1fr;gap:10px}.step-images,.step-images.one,.compare,.archive-gallery,.related-grid{grid-template-columns:1fr}.step-images img,.step-images:not(.one) img,.archive-gallery img,.archive-gallery img:nth-child(3n){grid-column:auto;height:auto;max-height:70svh;object-fit:cover}.contact{padding:85px 0}.contact-actions{flex-direction:column}.related{padding:85px 0}.related-top{display:block}.related-top .more{display:inline-block;margin-top:20px}}
</style></head><body><nav><div class="shell nav"><a class="logo" href="/">제자리에</a><a class="back" href="/work/">← WORK</a></div></nav><main id="content"><div class="shell empty">시공사례를 불러오고 있습니다.</div></main><footer><div class="shell">© 2026 JEJARIE</div></footer><script>
const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('id');
const section=(label,title,body,cls='')=>`<section class="record ${cls}"><div class="shell"><div class="record-head"><div class="eyebrow">${label}</div><h2>${title}</h2></div>${body}</div></section>`;
fetch('/api/public-content',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{
 const all=Array.isArray(data.projects)?data.projects:[],x=all.find(v=>v.id===id);if(!x)throw 0;
 document.title=`${x.title} | 제자리에`;document.querySelector('meta[name="description"]').content=x.description||'제자리에 시공사례';document.getElementById('canonical').href=`https://www.jejarie.com/work/detail/?id=${encodeURIComponent(x.id)}`;
 const imgs=Array.isArray(x.images)?x.images:[],cover=x.coverImage||imgs[0]||'',steps=Array.isArray(x.processSteps)?x.processSteps.filter(s=>s&&(s.title||s.description||(s.images||[]).length)):[],findings=Array.isArray(x.findings)?x.findings.filter(Boolean):[];
 const used=new Set([cover,x.beforeImage,x.afterImage,x.followUp?.image,...steps.flatMap(s=>Array.isArray(s.images)?s.images:[])].filter(Boolean)),extras=imgs.filter(src=>!used.has(src));
 const story=x.story||x.details||'';
 const hero=`<header class="shell head"><div class="eyebrow">${esc(x.category)} / PROJECT RECORD</div><h1>${esc(x.title)}</h1><p class="lead">${esc(x.description)}</p><div class="facts"><span>${esc(x.region)}</span><span>${esc(x.workDate||x.year||'')}</span><span>${imgs.length} PHOTOS</span></div></header>${cover?`<figure class="hero-media"><img src="${esc(cover)}" alt="${esc(x.title)} 대표 시공사진" fetchpriority="high"></figure>`:''}`;
 const storySection=story?section('01 / SITE STORY','현장 이야기.',`<div class="record-copy">${esc(story)}</div>${x.beforeImage?`<img class="story-photo" src="${esc(x.beforeImage)}" alt="${esc(x.title)} 시공 전 현장" loading="lazy">`:''}`):'';
 const findingSection=findings.length?section('02 / CHECKED','확인한 부분.',`<div class="findings">${findings.map(v=>`<div class="finding">${esc(v)}</div>`).join('')}</div>`):'';
 const processSection=steps.length?section('03 / PROCESS','작업 과정.',`<div class="process-list">${steps.map((s,i)=>{const photos=Array.isArray(s.images)?s.images:[];return `<article class="process-step"><div class="step-copy"><div class="step-number">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(s.title||`작업 단계 ${i+1}`)}</h3>${s.description?`<p>${esc(s.description)}</p>`:''}</div></div>${photos.length?`<div class="step-images ${photos.length===1?'one':''}">${photos.map((src,n)=>`<img src="${esc(src)}" alt="${esc(s.title||x.title)} ${n+1}" loading="lazy">`).join('')}</div>`:''}</article>`}).join('')}</div>`):'';
 const compareSection=x.beforeImage&&x.afterImage?section('04 / BEFORE & AFTER','전과 후.',`<div class="compare"><figure><img src="${esc(x.beforeImage)}" alt="${esc(x.title)} 시공 전" loading="lazy"><figcaption><span>BEFORE</span><span>시공 전</span></figcaption></figure><figure><img src="${esc(x.afterImage)}" alt="${esc(x.title)} 시공 후" loading="lazy"><figcaption><span>AFTER</span><span>시공 후</span></figcaption></figure></div>`):'';
 const gallerySection=extras.length?section('FIELD PHOTOS','현장 사진.',`<div class="archive-gallery">${extras.map((src,i)=>`<img src="${esc(src)}" alt="${esc(x.title)} 현장사진 ${i+1}" loading="lazy">`).join('')}</div>`):'';
 const resultSection=x.result?section('05 / RESULT','작업 결과.',`<div class="record-copy">${esc(x.result)}</div>`):'';
 const follow=x.followUp||{},followSection=follow.period||follow.content?section('06 / FOLLOW-UP','시공 후 경과.',`<div class="record-copy">${follow.period?`<span class="period">${esc(follow.period)}</span>`:''}${follow.content?`<div>${esc(follow.content)}</div>`:''}</div>${follow.image?`<img class="follow-photo" src="${esc(follow.image)}" alt="${esc(x.title)} 시공 후 경과" loading="lazy">`:''}`):'';
 const reviewSection=x.reviewVisible&&x.review?section('07 / REVIEW','고객 후기.',`<p class="quote">${esc(x.review)}</p>`,'review'):'';
 const contact=`<section class="contact"><div class="shell contact-grid"><div><div class="eyebrow">CONSULTATION</div><h2>비슷한 문제로<br>고민하고 계신가요?</h2></div><div><p>어떤 공사가 필요한지 모르셔도 괜찮습니다. 현장 사진을 보내주시면 먼저 확인해드립니다.</p><div class="contact-actions"><a href="https://open.kakao.com/o/sRI5ZKNi" target="_blank" rel="noopener noreferrer">카카오로 사진 보내기 ↗</a><a href="tel:01023961935">전화 문의 010-2396-1935</a></div></div></div></section>`;
 const related=all.filter(v=>v.id!==x.id&&v.category===x.category).sort((a,b)=>String(b.workDate||b.publishedAt||'').localeCompare(String(a.workDate||a.publishedAt||''))).slice(0,3);
 const relatedSection=`<section class="related"><div class="shell"><div class="related-top"><div><div class="eyebrow">RELATED WORK</div><h2>같은 분야의<br>시공 기록.</h2></div><a class="more" href="/work/">더 많은 시공사례 보기 →</a></div>${related.length?`<div class="related-grid">${related.map(v=>`<a class="related-card" href="/work/detail/?id=${encodeURIComponent(v.id)}"><img src="${esc(v.coverImage||v.images?.[0]||'')}" alt="${esc(v.title)}" loading="lazy"><small>${esc(v.category)} · ${esc(v.region)}</small><h3>${esc(v.title)}</h3></a>`).join('')}</div>`:'<p class="related-empty">같은 분야의 다른 시공사례를 준비하고 있습니다.</p>'}</div></section>`;
 document.getElementById('content').innerHTML=hero+storySection+findingSection+processSection+compareSection+gallerySection+resultSection+followSection+reviewSection+contact+relatedSection;
}).catch(()=>document.getElementById('content').innerHTML='<div class="shell empty"><h1>시공사례를 찾지 못했습니다.</h1><p><a href="/work/">WORK 목록으로 돌아가기</a></p></div>');
</script></body></html>
