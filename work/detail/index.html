<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2efe8"><title>시공사례 | 제자리에</title><style>:root{--paper:#f2efe8;--ink:#191816;--muted:#6d6962;--line:#cbc6bc;--brown:#896848}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;letter-spacing:-.025em}.shell{width:min(1240px,92vw);margin:auto}a{color:inherit}nav{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:800;letter-spacing:-.07em;text-decoration:none}.back{font-size:12px;text-decoration:none}.head{padding:90px 0 70px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--brown)}h1{max-width:12em;font-size:clamp(52px,7vw,104px);line-height:1.08;letter-spacing:-.06em;margin:24px 0 35px}.lead{max-width:700px;font-size:18px;line-height:1.8;color:var(--muted)}.facts{display:flex;gap:40px;border-top:1px solid var(--line);padding-top:18px;margin-top:50px;font-size:13px}.gallery{display:grid;gap:20px}.gallery img{width:100%;max-height:88vh;object-fit:cover}.copy{display:grid;grid-template-columns:1fr 2fr;gap:8vw;padding:110px 0;border-bottom:1px solid var(--line)}.copy h2,.review h2{font-size:clamp(34px,4.5vw,64px);line-height:1.12;letter-spacing:-.045em;margin:0}.details{white-space:pre-line;line-height:1.9;color:#504d48}.review{padding:100px 0;display:grid;grid-template-columns:1fr 2fr;gap:8vw}.quote{font-size:clamp(25px,3vw,42px);line-height:1.5;letter-spacing:-.035em;margin:0}.quote:before{content:'“';color:var(--brown)}.quote:after{content:'”';color:var(--brown)}footer{background:var(--ink);color:var(--paper);padding:35px 0 80px;font-size:12px}.empty{padding:120px 0}@media(max-width:700px){.shell{width:calc(100% - 36px)}nav{height:64px}.head{padding:65px 0 50px}h1{font-size:48px}.facts{flex-wrap:wrap;gap:12px 25px}.copy,.review{grid-template-columns:1fr;padding:75px 0;gap:35px}.gallery{gap:10px}}</style></head><body><nav><div class="shell nav"><a class="logo" href="/">제자리에</a><a class="back" href="/work/">← WORK</a></div></nav><main id="content" class="shell"><div class="empty">시공사례를 불러오고 있습니다.</div></main><footer><div class="shell">© 2026 JEJARIE</div></footer><script>const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('/api/public-content',{cache:'no-store'}).then(r=>r.json()).then(data=>{const x=(Array.isArray(data.projects)?data.projects:[]).find(v=>v.id===id);if(!x)throw 0;document.title=`${x.title} | 제자리에`;const imgs=x.images||[];document.getElementById('content').innerHTML=`<header class="head"><div class="eyebrow">${esc(x.category)} / WORK</div><h1>${esc(x.title)}</h1><p class="lead">${esc(x.description)}</p><div class="facts"><span>${esc(x.region)}</span><span>${esc(x.workDate||x.year||'')}</span><span>${imgs.length} PHOTOS</span></div></header><div class="gallery">${imgs.map((src,i)=>`<img src="${esc(src)}" alt="${esc(x.title)} 시공사진 ${i+1}" ${i?'loading="lazy"':''}>`).join('')}</div>${x.details?`<section class="copy"><h2>작업 내용</h2><div class="details">${esc(x.details)}</div></section>`:''}${x.reviewVisible&&x.review?`<section class="review"><h2>고객 후기</h2><p class="quote">${esc(x.review)}</p></section>`:''}`}).catch(()=>document.getElementById('content').innerHTML='<div class="empty"><h1>시공사례를 찾지 못했습니다.</h1><p><a href="/work/">WORK 목록으로 돌아가기</a></p></div>');</script></body></html>
